# Tunable filter rules. Edit these instead of the code -- the classifier reads
# this file at run time, so changing the lists needs no redeploy.

target_term:
  # A listing must be plausibly this term to survive.
  label: "Summer 2027"
  # Any of these in the title means it IS the target term.
  accept_patterns:
    - "summer 2027"
    - "2027 summer"
    - "summer '27"
    - "class of 2028"
    - "su27"
  # Any of these means it is explicitly a DIFFERENT term -> reject outright.
  reject_patterns:
    - "winter 2027"
    - "winter 2026"
    - "fall 2026"
    - "fall 2027"
    - "spring 2027"
    - "spring 2026"
    - "summer 2026"
    - "2026 summer"
    - "class of 2026"
    - "class of 2027"
    - "co-op 2026"
  # Listings naming no term at all. In Sept 2026 an unlabelled internship req
  # is overwhelmingly for the next summer, so these are kept but flagged so you
  # can eyeball them in the sheet rather than trusting the filter blindly.
  unspecified_action: "include_flagged"

# Degree requirements you are not eligible for as an undergrad.
reject_degree_patterns:
  - "mba"
  - "ph.d"
  - "phd"
  - "doctoral"
  - "master's only"
  - "masters only"
  - "graduate student"
  - "grad student"

# Roles that count. First match wins, so order is meaningful.
categories:
  - name: "Product Management"
    patterns: ["product management", "product manager", "associate product manager",
               "apm intern", "technical product", "product owner", "product strategy"]
  - name: "Product Design"
    patterns: ["product design", "ux design", "ui/ux", "user experience", "ux/ui",
               "ux researcher", "user research", "interaction design", "design intern"]
  - name: "Consulting / Strategy"
    patterns: ["consulting", "consultant", "strategy intern", "business strategy",
               "strategy & operations", "management consulting", "corporate strategy"]
  - name: "Technical / Adjacent"
    patterns: ["product analyst", "data analyst", "business analyst", "business analytics",
               "business intelligence", "solutions engineer", "technical program",
               "program management", "growth intern", "product operations"]

# Hard rejects. Checked before anything else -- these never reach the model.
reject_categories:
  # Software engineering, explicitly not wanted. Kept separate from the list
  # below so it is obvious what to delete if that ever changes. Note this is
  # about the ROLE: a technical product or product analyst role still counts.
  - "software engineer"
  - "software engineering"
  - "software developer"
  - "swe intern"
  - "full stack"
  - "full-stack"
  - "backend engineer"
  - "back end engineer"
  - "frontend engineer"
  - "front end engineer"
  - "web developer"
  - "mobile developer"
  - "android developer"
  - "ios developer"
  - "devops"
  - "site reliability"
  - "embedded engineer"
  - "firmware"
  - "compiler"
  - "machine learning engineer"
  - "research scientist"

  - "architecture"
  - "architectural"
  - "civil engineer"
  - "structural engineer"
  - "mechanical engineer"
  - "chemical engineer"
  - "electrical engineer"
  - "nursing"
  - "clinical"
  - "pharmacist"
  - "accounting"
  - "audit"
  - "tax intern"
  - "sales representative"
  - "sales intern"
  - "account executive"
  - "recruiting intern"
  - "human resources"
  - "supply chain"
  - "warehouse"
  - "construction"
  - "interior design"
  - "landscape"

# Sources. jobright publishes one repo per job family; all four carry roles that
# fit the brief once the filters below run. intern-list is best-effort: see the
# STATUS note at the top of radar/sources/internlist.py.
sources:
  jobright_repos:
    - "jobright-ai/2026-Product-Management-Internship"
    - "jobright-ai/2026-Design-Internship"
    - "jobright-ai/2026-Business-Analyst-Internship"
    - "jobright-ai/2026-Data-Analysis-Internship"
  # intern-list.com short links. These map to jobright minisite paths in
  # radar/sources/internlist.py -- "cst" is consulting, which the four GitHub
  # repos do not cover at all.
  # Community lists. Different table formats, handled in sources/ghlist.py.
  # Listings closed (🔒) or requiring an advanced degree (🎓) are dropped there.
  github_lists:
    - "vanshb03/Summer2027-Internships"
    - "SimplifyJobs/Summer2027-Internships"
    - "dreamworkhq/Tech-Internships-2027"

  # Each feed returns 50 listings with exact posting timestamps, structured
  # qualifications and salary. "swe" is deliberately omitted: every row would be
  # rejected by reject_categories anyway.
  internlist_feeds:
    - "pm"
    - "cd"
    - "cst"
    - "ba"
    - "da"
    - "me"

# Only listings first seen within this many hours are written.
window_hours: 24

# Fetch the real job description from each application page and derive keywords
# and skill requirements from it, instead of inferring from the role title.
# Costs one HTTP request per new listing; only ever runs on listings that
# already passed dedup and the relevance filter.
fetch_descriptions: true
description_max_chars: 6000
description_workers: 6

# Apollo is only asked about listings whose posting printed no contact address.
# It bills credits per reveal, so cap the companies queried per run (0 = no cap).
apollo_max_lookups: 15

# After each run appends new listings, retry this many existing rows that are
# still missing skill requirements or a contact email, newest first. Keeps the
# table healing itself as the scraping improves, without re-fetching pages that
# never yield anything on every single tick. 0 disables it; the manual backfill
# dispatch input ignores this cap and sweeps everything.
#
# Raised from 25 while there is a backlog to clear. Until the original-post fix
# every backfill returned 0 rows, so effectively every stored row still needs
# one good pass. At 60 a few hundred rows are healed within a day; drop it back
# to 25 afterwards, when the only rows left are the ones whose pages genuinely
# print nothing and re-fetching them every tick is waste.
backfill_per_run: 60

# Rows with this Applied status get a tailored resume rendered and attached.
# Tailoring costs a model call and a render per posting, so it is opt-in per row
# rather than something every listing receives.
resume_trigger_status: "Applying"

# Resumes rendered per scheduled run. Mark a row Applying and it gets one within
# the hour, without triggering anything by hand. Bounded because each costs a
# model call, a render and an upload; the manual tailor_resumes input ignores
# this cap. 0 disables the automatic pass.
resume_per_run: 5

# Job boards read by the model rather than by a hand-written parser. Use this
# for a site whose markup is unknown or likely to change: the page is fetched
# on the runner and Claude returns the listings as rows. Costs one call per
# source per run, and does nothing when ANTHROPIC_API_KEY is unset.
#
# Adding a source here needs no code. A hand-written parser is still the better
# choice for a source whose shape is known and stable -- see radar/sources/.
# Each entry costs one model call per run, so keep the list short and prefer a
# URL that already carries the filters you want -- a pre-filtered board returns
# a page of relevant rows rather than a page you pay to have read and discard.
model_sources:
  - name: "apmseason"
    url: "https://www.apmseason.com/internships"

  # Aggregates company career pages and applicant tracking systems (Greenhouse,
  # Lever, Workable, Workday) rather than reposting other boards, so it surfaces
  # smaller companies the community lists never reach. The searchState in this
  # URL pins it to Design, Product Management and Marketing internships from
  # the last seven days. Seven rather than two so a missed run never drops a
  # listing, and so seeding has a backlog to draw on; the recency window still
  # decides what actually reaches Notion.
  - name: "hiringcafe"
    url: "https://hiringcafe.com/?searchState=%7B%22commitmentTypes%22%3A%5B%22Internship%22%5D%2C%22dateFetchedPastNDays%22%3A7%2C%22departments%22%3A%5B%22Design%22%2C%22Product+Management%22%2C%22Marketing%22%5D%7D"

  # Startups and small teams, where a product or design internship is rarely
  # posted anywhere else. Uncomment to enable; both are worth a look but may
  # gate their full listings behind a login, in which case the run will log
  # "almost no readable content" and cost you nothing further.
  # - name: "workatastartup"
  #   url: "https://www.workatastartup.com/jobs?role=design"
  # - name: "wellfound"
  #   url: "https://wellfound.com/role/l/product-designer/internship"

# Set false to skip the Claude adjudication pass entirely (keyword rules only).
use_model_for_uncertain: true
