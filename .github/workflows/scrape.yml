name: internship-radar

# Hourly scrape of internship sources into Notion.

on:
  schedule:
    # Every hour at :20. The jobright repos commit roughly every 70 minutes,
    # so hourly sampling reliably catches each batch.
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Reconstruct real posting times from source git history (first run only)"
        type: boolean
        default: false
      dry_run:
        description: "Run the pipeline but do not write to Notion"
        type: boolean
        default: false
      backfill:
        description: "Fill missing skills/contact emails on EXISTING rows (keeps Applied tags and resume PDFs)"
        type: boolean
        default: false
      tailor_resumes:
        description: "Tailor and attach a resume to every row marked Applying"
        type: boolean
        default: false
      clear_first:
        description: "DESTRUCTIVE: archive every existing row before scraping (rows go to Notion trash)"
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  # Never let a slow run overlap the next tick and double-write rows.
  group: internship-radar
  cancel-in-progress: false

jobs:
  scrape:
    # Pinned, not ubuntu-latest. The label moves to Ubuntu 26 on 2026-10-19,
    # and this job renders PDFs with whatever Chromium the runner image ships.
    # An unattended hourly job is the worst place to discover an image change,
    # so the bump happens when someone is watching. find_chrome() searches
    # several locations, but a missing browser still means no resumes.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # Says whether the key reached the runner, without printing it. A secret
      # that is missing, misnamed, saved as an Environment secret, or pasted
      # with a stray newline all look identical from the outside -- the run
      # succeeds and the model-read sources quietly return nothing.
      - name: Check the Claude key resolves
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "KEY: NOT SET. Neither ANTHROPIC_API_KEY nor CLAUDE_KEY resolved."
            echo "     The model sources (apmseason, hiring.cafe) will be skipped."
          else
            n=${#ANTHROPIC_API_KEY}
            case "$ANTHROPIC_API_KEY" in
              sk-ant-*) shape="looks like an Anthropic key" ;;
              *)        shape="DOES NOT start with sk-ant- -- wrong value pasted?" ;;
            esac
            echo "KEY: set, $n characters, $shape"
            case "$ANTHROPIC_API_KEY" in
              *[![:print:]]*) echo "     WARNING: contains a newline or control character. Re-paste it." ;;
            esac
          fi

      - name: Scrape
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # Either secret name works. The variable the code reads is fixed;
          # what the secret is called in repo settings is not.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          ARGS=""
          # Only ever reachable from a manual dispatch -- the cron cannot set it.
          if [ "${{ inputs.tailor_resumes }}" = "true" ]; then ARGS="$ARGS --tailor-resumes"; fi
          if [ "${{ inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          if [ "${{ inputs.clear_first }}" = "true" ]; then ARGS="$ARGS --clear-database"; fi
          if [ "${{ inputs.bootstrap }}" = "true" ]; then ARGS="$ARGS --bootstrap"; fi
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m radar.main $ARGS
