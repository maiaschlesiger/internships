<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "HN"; font-weight: 400;
               src: url("fonts/HelveticaNeue.ttf") format("truetype"); }
  @font-face { font-family: "HN"; font-weight: 500;
               src: url("fonts/HelveticaNeue-Medium.ttf") format("truetype"); }
  @font-face { font-family: "HN"; font-weight: 700;
               src: url("fonts/HelveticaNeue-Bold.ttf") format("truetype"); }
  @page { size: 8.5in 11in; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "HN", "Helvetica Neue", Helvetica, "Liberation Sans", Arial, sans-serif;
    font-size: 10.2pt; line-height: 1.52; color: #000;
    padding: 28pt 40pt 26pt 40pt; width: 8.5in; height: 11in;
    -webkit-font-smoothing: antialiased;
  }
  /* Same letterhead as the resume, so the pair reads as one application. */
  .name { font-size: 24.8pt; font-weight: 700; letter-spacing: -0.4pt; line-height: 1.1; }
  .tagline { font-size: 8.6pt; font-weight: 500; letter-spacing: 0.9pt;
             margin-top: 3pt; text-transform: uppercase; }
  .contact { font-size: 8.6pt; font-weight: 400; margin-top: 4pt; color: #222; }
  .meta { font-size: 9.4pt; margin-top: 20pt; color: #222; }
  .meta div { margin-top: 1pt; }
  p { margin-top: 10pt; }
  p.first { margin-top: 16pt; }
  .sign { margin-top: 16pt; }
</style></head>
<body>
  <div class="name">__NAME__</div>
  <div class="tagline">__TAGLINE__</div>
  <div class="contact">__CONTACT__</div>
  <div class="meta">__META__</div>
  __BODY__
  <div class="sign">__SIGNOFF__</div>
</body></html>
